[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stark-osint"
dynamic = ["version"]
description = "S.T.A.R.K - Security Threat Assessment and Reputation Kit: consolidated OSINT reputation lookups with STIX 2.1 support"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HuntsmanSec" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "flask>=2.3",
    "waitress>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["osint", "threat-intelligence", "ioc", "reputation", "stix", "dfir", "virustotal", "abuseipdb", "soc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7", "stix2>=3.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/HuntsmanSec/stark"
Issues = "https://github.com/HuntsmanSec/stark/issues"
Changelog = "https://github.com/HuntsmanSec/stark/blob/main/CHANGELOG.md"

[project.scripts]
stark = "stark.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stark.__version__" }

[tool.setuptools.packages.find]
include = ["stark*"]

[tool.setuptools.package-data]
"stark.web" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
